name: Auto-merge Copilot PRs

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [agentdev]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: github.event.pull_request.user.login == 'Copilot' && startsWith(github.event.pull_request.head.ref, 'copilot/')
    runs-on: ubuntu-latest
    steps:
      - name: Mark ready and squash-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr ready "$PR" || true
          gh pr merge "$PR" --squash --delete-branch
      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref agentdev